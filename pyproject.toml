[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["esp_riscv_trace"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tmp/"]

[tool.codespell]
skip = "*.bin,*.elf,.git,tmp,*.pyc,.mypy_cache,.ruff_cache,.venv,venv"
ignore-words-list = "hart,harts"

[tool.commitizen]
name = "czespressif"
version = "0.1.0"
update_changelog_on_bump = true
tag_format = "v$version"
changelog_merge_prerelease = true
annotated_tag = true
bump_message = "change: Update version to $new_version"
