[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-riscv-trace"
dynamic = ["version"]
description = "Decoder for RISC-V hardware instruction trace captured on Espressif chips"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Espressif Systems" },
]
keywords = ["esp32", "riscv", "trace", "espressif", "openocd", "coredump"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Environment :: Console",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyelftools>=0.29",
    "esp-pylib[cli,ide]>=1.2.1",
    "rich",
    "rich-click>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "commitizen",
    "czespressif>=1.3.1",
]
test = [
    "pytest",
]

[project.scripts]
esp-riscv-trace = "esp_riscv_trace.cli:main"

[project.urls]
Homepage = "https://github.com/espressif/esp-riscv-trace"
Repository = "https://github.com/espressif/esp-riscv-trace"
Source = "https://github.com/espressif/esp-riscv-trace/"
Tracker = "https://github.com/espressif/esp-riscv-trace/issues/"
Changelog = "https://github.com/espressif/esp-riscv-trace/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["esp_riscv_trace*"]

[tool.setuptools.dynamic]
version = { attr = "esp_riscv_trace.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["esp_riscv_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep ESP-IDF pytest plugins from filtering host-only tests
addopts = "-p no:idf-ci -p no:pytest_embedded"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tmp/"]

[tool.codespell]
skip = "*.bin,*.elf,.git,tmp,*.pyc,.mypy_cache,.ruff_cache,.venv,venv"
ignore-words-list = "hart,harts"

[tool.commitizen]
name = "czespressif"
version = "0.2.0"
update_changelog_on_bump = true
tag_format = "v$version"
changelog_merge_prerelease = true
annotated_tag = true
changelog_start_rev = "v0.1.0"
bump_message = "change: Update version to $new_version"
version_files = [
    "esp_riscv_trace/__init__.py:__version__",
]
